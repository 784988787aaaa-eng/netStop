name: Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK and native build tools
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK / NDK / CMake packages
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper if missing
        shell: bash
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Run static audit
        run: python3 tools/static_audit.py

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload debug and release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetLimiterPro-v8.2-GoldMaster-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
